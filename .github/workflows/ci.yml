name: Unit Tests CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff bandit

      - name: Ruff lint
        run: ruff check src/ --output-format=github || true

      - name: Bandit security scan
        run: bandit -r src/security/ src/self_healing/ src/core/security/ -ll -q

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsync-dev gettext cmake ninja-build libssl-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt --no-build-isolation
          pip install pytest pytest-asyncio pytest-mock hypothesis

      - name: Build pinned native PQC dependency
        run: |
          git clone --no-checkout https://github.com/open-quantum-safe/liboqs.git "$RUNNER_TEMP/liboqs"
          git -C "$RUNNER_TEMP/liboqs" checkout --detach 5a1a854b0dc9f2141bdc771c555ee60c37950183
          cmake -S "$RUNNER_TEMP/liboqs" -B "$RUNNER_TEMP/liboqs/build" -G Ninja \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/liboqs/build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/liboqs/build"
          sudo ldconfig
          python -m pip install liboqs-python==0.16.0.1
          python - <<'PYQ'
          import oqs
          assert "ML-KEM-768" in oqs.get_enabled_kem_mechanisms()
          assert "ML-DSA-65" in oqs.get_enabled_sig_mechanisms()
          with oqs.Signature("ML-DSA-65") as signer:
              public_key = signer.generate_keypair()
              signature = signer.sign(b"ci-native-pqc")
              assert signer.verify(b"ci-native-pqc", signature, public_key)
              assert not signer.verify(b"tampered", signature, public_key)
          PYQ

      - name: Run security tests
        run: |
          python3 -m pytest tests/unit/security/ -q --tb=short \
            -p no:cacheprovider -p no:cov \
            -x --maxfail=5

      - name: Run self-healing tests
        run: |
          python3 -m pytest tests/unit/self_healing/ -q --tb=short \
            -p no:cacheprovider -p no:cov \
            -x --maxfail=5

      - name: Run core tests
        run: |
          python3 -m pytest tests/unit/core/ -q --tb=short \
            -p no:cacheprovider -p no:cov \
            -x --maxfail=5

      - name: Compile check critical modules
        run: |
          python3 -m py_compile src/self_healing/svid_signer.py
          python3 -m py_compile src/self_healing/anomaly_consensus.py
          python3 -m py_compile src/self_healing/signed_command.py
          python3 -m py_compile src/core/security/subprocess_validator.py
          python3 -m py_compile src/security/pqc/kem.py
          python3 -m py_compile src/security/pqc/dsa.py
